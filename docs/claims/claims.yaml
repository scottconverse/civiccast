      # test_gst_worker_reload_ack.py), re-run green against the new design.
      # Blob IDs re-hashed with `git hash-object --path <file> <file>` per D2.
      # Re-provisioned again (same branch, second hostile-review pass,
      # 2026-09-06): worker.py and engine.py drifted a FOURTH time -- this
      # pass fixed real gaps in the settlement-tracking design above rather
      # than the design itself: (1) an armed-but-unsettled reload's tracking
      # (and its plan_dir) is now released on EVERY worker-exit path
      # (_poll_process, a fresh _start), not just the two call sites that
      # already released it (_poll_reload_settlement's own commit/abort/
      # deadline branches, _stop) -- a crash mid-settle used to leave the
      # tracking behind, firing a spurious restart at the 960s deadline
      # against a channel that had already moved on, and a LATE settlement
      # for that dead attempt is now recognized and logged as ignored
      # (daemon.py's new _discarded_reload_ids, out of this claim's scope);
      # (2) superseding a still-pending reload with a newer one now releases
      # the superseded attempt's plan_dir instead of silently leaking it;
      # (3) an unrecognized (neither "applied" nor "aborted:...") settlement
      # result is now treated as aborted immediately rather than silently
      # waited out for the full deadline. engine.py specifically: the POSIX
      # FIFO dispatch path (_dispatch_control) now passes an on_settled
      # callback too (it previously passed none at all, so a FIFO-dispatched
      # reload could never report settlement and always fell back to
      # restart at the deadline regardless of whether it actually landed) --
      # its reload id rides the reload sidecar's own filename
      # (reload_policy.reload_id_from_sidecar_path, a NEW gi-free sibling
      # function; reload_policy.py itself remains out of this claim's bound
      # module set per the existing narrowing note above) since the FIFO has
      # no separate envelope/ack id field the way the Windows D2 pipe does.
      # worker.py specifically: _dispatch_and_ack's dispatch call is now
      # wrapped in its own try/except (a raise escaping _dispatch_control_
      # with_ack's own internal handling -- e.g. from code that runs before
      # its try block -- used to leave NO ack written at all, so the
      # strategy's send_and_wait sat out its full timeout instead of getting
      # an immediate, honest "error" ack). Neither change touches
      # decode_policy.py, graph.py, control.py, or audio_tap.py, which keep
      # their recorded blobs. Current-source proof for these bytes is this
      # PR's own updated/added unit coverage: tests/egress/test_daemon.py
      # (worker-crash-during-arm discard + late-arrival log, supersede
      # releasing the previous plan_dir, _start tracking/releasing its own
      # active plan_dir), tests/egress/test_automation.py (the rollover
      # latch never retrying while the daemon reports a pending settlement),
      # and tests/egress/test_gst_engine_reload_concat_naming.py (new direct
      # coverage for _dispose_elements_best_effort and _release_selector_
      # pad_best_effort on the build/link failure paths -- the PRIOR
      # re-provisioning note above claimed this coverage before it existed;
      # it exists now).
      #
      # engine.py drifted a FIFTH time (candidate-3 build 34022552208, real-
      # GStreamer smoke on the installed product closure, 2026-09-06): the H1
      # fix's own fail-loud _make check assumed ``Gst.Bin.add()`` returns a
      # raw bool (True/False, never raising) -- true for the C API, but NOT
      # for gst-python's ``overrides/Gst.py`` wrapper, confirmed directly
      # against the installed runtime's real GStreamer 1.28.5: that override
      # returns ``None`` on a SUCCESSFUL add (never a bare ``True``) and
      # RAISES ``Gst.AddError`` on a genuine duplicate (never a bare
      # ``False``). ``if not self.pipeline.add(element):`` treated that
      # ``None`` success as a failure, so the very FIRST element ever added
      # to a real pipeline (the video selector, name "sel") always raised --
      # every initial build against this installed closure, unconditionally,
      # not a real name collision at all. Fixed with a new ``_bin_add``
      # helper that normalizes both contracts to a plain bool; no other
      # engine.py behavior changed. Neither worker.py, decode_policy.py,
      # graph.py, control.py, nor audio_tap.py changed. Current-source proof:
      # the real installed-closure smoke
      # (civiccast.native.installed_gstreamer_smoke) re-run locally against
      # this fix now PASSes (previously failed exactly as candidate-3's CI
      # run did), plus new direct unit coverage in
      # tests/egress/test_gst_engine_reload_concat_naming.py
      # (_FakeOverrideStylePipeline models the None-on-success/raises-on-
      # failure contract; proves _make succeeds on a first-ever add under it,
      # still fails loud on a genuine duplicate under it, and that selector +
      # source-leg names stay unique across an initial build and three
      # simulated reloads). Blob IDs re-hashed with
      # `git hash-object --path <file> <file>` per D2.
      #
      # engine.py and worker.py drifted a SIXTH time (item 82, sandbox run 13
      # evidence, 2026-09-06): a fresh worker under CPU load hit
      # ``pipeline did not reach PLAYING within 5.0s`` -- the old bound reused
      # ``teardown_timeout_s`` (5.0s), never meant to double as a preroll
      # bound -- and the daemon relaunched it as an ordinary crash. Fixed:
      # ``_await_playing`` now waits up to a dedicated, configurable
      # ``preroll_timeout_s`` (30s default, ``CIVICCAST_GST_PREROLL_TIMEOUT_S``
      # env override, clamped to ``[5, 45]``s), polling every 5s and logging
      # the ``get_state`` result, the CURRENT pipeline state, AND the pending
      # state on every slice instead of blocking silently, and raises the
      # distinct ``PrerollTimeoutError`` once the bound is exceeded.
      # ``worker.py`` catches that and exits with the distinct
      # ``civiccast.egress.gst.exit_codes.GST_PREROLL_TIMEOUT_EXIT_CODE`` (a
      # new, gi-free sibling module, NOT itself bound here -- the daemon's own
      # ``civiccast/egress/daemon.py`` reads it and is not a code input of
      # this native-Windows-line spike claim) and, on that path, still emits
      # its ``WORKER_RESULT`` receipt (``{"error": ("preroll-timeout", ...),
      # "teardown_clean": False}``) so
      # ``civiccast.native.installed_gstreamer_smoke.require_clean_worker_result``
      # can name the reason instead of reporting a missing receipt. Neither
      # graph.py, control.py, decode_policy.py, nor audio_tap.py changed.
      #
      # Round-2 review BLOCKER (Opus, PR #183, same day): the 45s upper clamp
      # above is load-bearing, not cosmetic -- an unclamped bound
      # >= ``_RESTART_STREAK_RESET_UPTIME_S`` (60s, ``civiccast/egress/
      # daemon.py``) made a worker that ALWAYS preroll-times-out still measure
      # >= 60s of "uptime" on every single exit, which reset the daemon's
      # crash-loop streak on every crash and silently defeated escalation to
      # fallback slate forever (measured: 40 relaunches, streak stuck at 0).
      # Fixed on BOTH sides: engine.py's clamp keeps the configured bound
      # under that threshold with margin, AND ``EgressDaemon.
      # _relaunch_after_crash`` now exempts a
      # ``GST_PREROLL_TIMEOUT_EXIT_CODE`` exit from the healthy-uptime streak
      # reset outright (a preroll that never reached PLAYING is not "healthy
      # uptime" regardless of how long it took) -- daemon.py is not itself a
      # `code` input of this native-Windows-line spike claim (unchanged from
      # before this entry existed), so only engine.py's re-hash reflects this
      # round.
      #
      # Round-3 review BLOCKER (Opus, PR #183): Round-2's fix (the 45s clamp
      # + the crash-path exemption) turned out to be INCOMPLETE, not merely
      # cosmetic-plus-one-more-belt -- ``EgressDaemon._poll_process`` has a
      # SEPARATE healthy-uptime reset on the ALIVE-poll path (no returncode
      # to exempt there) that reset the crash streak on wall-clock seconds
      # since the worker was SPAWNED, which also counts interpreter start +
      # ``import gi``/``Gst.init`` + graph build + the preroll wait itself --
      # none of which is air. Measured against the real ``process_once``
      # loop: a worker "alive" per poll for 60-62s before its preroll-timeout
      # exit got its streak reset every tick past the 60s mark, BEFORE it
      # ever exited -- streak stuck at 1, never escalating to fallback slate
      # in 40 cycles. Also fixed the same round: CHANGELOG.md's "either fix
      # alone would have closed the hole" claim (false, per the above) and
      # this module's own "regardless of how this bound is configured"
      # claim (same falseness, corrected in engine.py's module comment); and
      # ``CIVICCAST_GST_PREROLL_TIMEOUT_S=nan`` escaping the ``[5, 45]``
      # clamp entirely (``min(max(nan, 5), 45)`` is ``nan``, not ``5.0`` --
      # Python's min/max keep their first argument across any NaN
      # comparison), which reached ``_await_playing`` as the deadline
      # arithmetic's operand and fell through to the generic pipeline-
      # construction ``ValueError`` path instead of the distinct
      # ``PrerollTimeoutError``. Fixed: ``_await_playing`` now prints a
      # stable ``CTRL preroll: reached PLAYING`` marker ONLY on the actual
      # success path (engine.py), the daemon greps for it via the new
      # ``civiccast.egress.health.worker_reached_playing`` (health.py, not
      # itself bound here -- see the daemon.py note above for why daemon-
      # side files are out of scope for this claim) and only starts its 60s
      # healthy-uptime clock from the moment that evidence is first
      # observed, and ``_resolve_preroll_timeout_s`` now guards both the
      # explicit-arg and env-var paths with ``math.isfinite`` before
      # clamping. worker.py also changed this round (item 5, a carry-over
      # follow-up, not a blocker): ``PrerollTimeoutError`` used to propagate
      # out of ``run_forever`` without ``engine_instance.stop()`` ever
      # running, so the only teardown was the unconditional ``os._exit()``
      # at the bottom of the file; ``main()``'s except branch now attempts
      # ``stop(force_exit_on_hang=False)`` (already time-bounded via
      # ``teardown_timeout_s``; deliberately NOT ``force_exit_on_hang=True``,
      # which would swap the distinct exit code for a generic forced-kill
      # one on a stuck teardown) and reports the real ``teardown_clean``
      # outcome instead of a hardcoded False. Neither graph.py, control.py,
      # decode_policy.py, nor audio_tap.py changed.
      #
      # Round-4 review BLOCKER (Opus, PR #183), REPRODUCED: round-3's fix
      # above (``worker_reached_playing``) was itself not sufficient --
      # ``strategy.py`` / ``_ffmpeg.py`` (neither a code input of this claim)
      # open the channel's per-worker stderr log in APPEND mode and never
      # truncate it per spawn, so ONE worker ever reaching PLAYING left the
      # marker in the log forever, and every LATER worker on the same
      # channel read as "confirmed on air" on its own very first poll tick
      # (measured: 40 relaunches, streak pinned at 1 -- the round-2 symptom,
      # reproduced through the round-3 fix unchanged). Fixed with two
      # independent anchors: the daemon (``civiccast/egress/daemon.py``, not
      # itself a code input here) now snapshots the log's byte size at each
      # worker's own spawn (``_stderr_spawn_offset``) and scans only bytes at
      # or after it (``civiccast.egress.health.worker_reached_playing`` /
      # the new ``read_ffmpeg_encoder_metrics_since``, health.py likewise not
      # bound here); AND engine.py's marker now also prints the worker's own
      # pid (``... pid=1234``, ``os.getpid()``), which the daemon requires to
      # match its currently-tracked process before crediting the marker --
      # a second, independent check that holds even if the byte offset were
      # ever wrong. Only engine.py's re-hash reflects this round; worker.py
      # is unchanged and its blob is unchanged from the round-3 value.
      #
      # engine.py and worker.py drifted a SEVENTH time (item 84, measured in
      # sandbox run 15, soak-fcfcb81-20260906-183448Z, and in three
      # seamless-OFF runs, 2026-09-06): every fresh worker reached PLAYING
      # quickly (``CTRL preroll: reached PLAYING after 0.3s``) then
      # immediately hit ``CTRL stall: no output for 10s - quitting for daemon
      # restart`` -- ``_arm_stall_watchdog`` armed the 10s post-first-buffer
      # stall bound the instant PLAYING was reached, but PLAYING (even
      # NO_PREROLL) is not evidence a single buffer crossed the mux, and
      # under start-up load (a concurrent ffmpeg conform, a ~10s synchronous
      # content-reload source preparation, live caption-tap overload) the
      # first buffer legitimately took longer than 10s, killing healthy
      # workers. Fixed: ``_check_stall`` now measures two DISTINCT budgets --
      # while no output has been observed yet, a new, separate, configurable
      # ``first_output_timeout_s`` (45s default,
      # ``CIVICCAST_GST_FIRST_OUTPUT_TIMEOUT_S`` env override, clamped to
      # ``[10, 120]``s, ``math.isfinite``-guarded exactly like
      # ``_resolve_preroll_timeout_s``); only once the first buffer IS
      # observed does the original 10s ``stall_timeout_s`` apply, unchanged.
      # A distinct stderr marker (``CTRL first-output: no output within Ns of
      # PLAYING``) and a distinct ``("first-output-timeout", ...)``
      # ``WORKER_RESULT`` error reason let ``worker.py`` exit with a new,
      # distinct ``civiccast.egress.gst.exit_codes.
      # GST_FIRST_OUTPUT_TIMEOUT_EXIT_CODE`` (the same gi-free sibling module
      # as ``GST_PREROLL_TIMEOUT_EXIT_CODE``, NOT itself bound here) instead
      # of the generic crash code 1 every other engine failure uses.
      # ``EgressDaemon._relaunch_after_crash`` (``civiccast/egress/
      # daemon.py``, not itself a code input of this claim, same as every
      # other daemon-side file noted above) now rate-limits this new exit
      # code the same way it already does ``GST_PREROLL_TIMEOUT_EXIT_CODE``
      # (``_SLOW_START_EXIT_CODES``, shared cooldown bookkeeping) -- exempt
      # from the healthy-uptime streak reset, capped to one streak increment
      # per 60s -- so a train of legitimate slow starts never trips the
      # crash-loop escalation to fallback slate for a source that is
      # actually fine. Neither graph.py, control.py, decode_policy.py, nor
      # audio_tap.py changed.
