      # Re-provisioned again (same branch, hostile-review follow-up,
      # 2026-09-06): worker.py and engine.py drifted a THIRD time within this
      # PR -- a self-review caught that the ack-waits-for-settlement design
      # above was itself wrong (a deferred/boundary-aligned switch can take
      # up to defer_switch_timeout_s=900s to settle, far longer than a pipe
      # ack should ever block, and the strategy's bounded wait would time out
      # on a correctly-armed long-lead reload and get the daemon to terminate
      # a healthy worker). worker.py's "reload" ack now means "armed" only,
      # written synchronously; the eventual settle outcome is reported
      # out-of-band via a new reload-status.json file
      # (_write_reload_status), polled by the (out-of-claim-scope)
      # daemon.py. engine.py also gained two adjacent leak fixes found on the
      # same pass: _instantiate_source_leg and the reload_program build/link
