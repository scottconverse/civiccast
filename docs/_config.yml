# Jekyll configuration for the GitHub Pages copy of docs/.
#
# Pages builds only the pages a visitor can reach from the public entry points
# (docs/index.html, docs/install-windows.html, README, SUPPORT, FAQ,
# CAPABILITIES, INSTALL-WINDOWS, USER-MANUAL, CHANGELOG, docs/tester/*,
# release notes and verifications). Everything below is internal working
# material linked from nothing public.
#
# `exclude` only hides files from the Pages build. The files stay in the
# repository and stay readable on GitHub; tests, CI and scripts that read
# docs/ are unaffected.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
