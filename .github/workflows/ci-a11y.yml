# SPDX-License-Identifier: Apache-2.0
# Accessibility CI gate. Runs axe-core via Playwright against the built
# public portal AND the built operator console. Blocks merge on any
# serious or critical WCAG 2.0/2.1/2.2 A/AA violation. Per CivicCast
# spec §4.1 and CLAUDE.md non-negotiables.

name: ci-a11y

on:
  pull_request:
    # Docs-only and agent-tooling-only (.claude/, vlite.json) changes start no CI run.
    paths: ['**', '!**.md', '!**.mdx', '!**.rst', '!**.docx', '!**.pdf', '!**/LICENSE', '!**/LICENSE.*', '!**/NOTICE', '!**/NOTICE.*', '!docs/**.png', '!docs/**.jpg', '!docs/**.svg', '!docs/**.gif', '!docs/**.webp', '!docs/**.html', '!docs/**.css', '**/SKILL.md', '**/skills/**', '**/agents/**', '**/commands/**', '**/prompts/**', '**/references/**', '!.claude/**', '!**/.claude/**', '!vlite.json']
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Both jobs run inside the ready-made Playwright image instead of installing
# browsers with `npx playwright install --with-deps`. On 2026-11-18 the Ubuntu
# archive was slow for ~2 hours and that install step hung on apt; on a normal
# day it takes 23-63 s. The image is Microsoft's, pinned by digest, and its tag
# version MUST equal the @playwright/test version in both portals' lockfiles
# (1.59.1 at the time of writing) -- a step in each job re-checks that, so a
# future lockfile bump that forgets the image fails loudly instead of running
# the wrong browser build.
jobs:
  image-ready:
    name: ci image pull (retry)
    # GitHub's runner does NOT retry a container image pull: DockerCommandManager
    # calls `docker pull` once (actions/runner src/Runner.Worker/Container/
    # DockerCommandManager.cs). So the download is retried here, on a normal
    # hosted runner, before the container jobs are allowed to start.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Pull the pinned Playwright image (3 attempts)
        run: |
          set -euo pipefail
          IMAGE="mcr.microsoft.com/playwright:v1.59.1-noble@sha256:PENDING_DIGEST"
          for attempt in 1 2 3; do
            if docker pull "$IMAGE"; then
              echo "Pulled on attempt ${attempt}: ${IMAGE}"
              exit 0
            fi
            echo "::warning::attempt ${attempt} to pull ${IMAGE} failed; retrying"
            sleep 20
          done
          echo "::error::could not pull ${IMAGE} after 3 attempts"
          exit 1

  a11y-public:
    name: Accessibility (axe-core) — public portal
    needs: image-ready
    # Playwright 1.59.1 does not support the ubuntu26.04 image behind latest.
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble@sha256:PENDING_DIGEST
    timeout-minutes: 30
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: civiccast/apps/portal-public
        # Container jobs default to `sh`; every step here is bash.
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect portal presence
        id: portal-check
        working-directory: ${{ github.workspace }}
        run: |
          if [ -f "civiccast/apps/portal-public/package.json" ]; then
            echo "portal_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "portal_present=false" >> "$GITHUB_OUTPUT"
            echo "Public portal not yet present — gate is a no-op for this commit."
          fi

      - name: Set up Node 20
        if: steps.portal-check.outputs.portal_present == 'true'
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: civiccast/apps/portal-public/package-lock.json

      - name: Install dependencies
        if: steps.portal-check.outputs.portal_present == 'true'
        run: npm ci

      - name: Verify preinstalled Playwright browsers (image proof)
        if: steps.portal-check.outputs.portal_present == 'true'
        # No `npx playwright install` here: the image ships the browsers.
        # This step is the proof, in the job log, that (a) the image's
        # Playwright version equals the one in this portal's lockfile and
        # (b) the chromium AND webkit builds the config needs are present.
        # webkit as well as chromium: portal-public's playwright.config.ts
        # declares BOTH projects; a missing webkit is 13 resident-facing a11y
        # specs failing in ~3ms with "Executable doesn't exist". The operator
        # job below checks chromium only, correctly: its own config declares
        # no webkit project.
        shell: bash
        run: |
          set -euo pipefail
          want=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          got=$(npx playwright --version | awk '{print $2}')
          echo "lockfile @playwright/test: ${want}"
          echo "image playwright:          ${got}"
          test "$want" = "$got" || { echo "::error::image Playwright ${got} != lockfile ${want}"; exit 1; }
          echo "browsers in ${PLAYWRIGHT_BROWSERS_PATH:-/ms-playwright}:"
          ls -1 "${PLAYWRIGHT_BROWSERS_PATH:-/ms-playwright}"
          for browser in chromium webkit; do
            ls -d "${PLAYWRIGHT_BROWSERS_PATH:-/ms-playwright}/${browser}-"* >/dev/null \
              || { echo "::error::missing ${browser} build in the image"; exit 1; }
          done

      - name: Build portal
        if: steps.portal-check.outputs.portal_present == 'true'
        run: npm run build

      - name: Run axe-core via Playwright
        if: steps.portal-check.outputs.portal_present == 'true'
        # Retain decoder warnings for the two diagnosed WebKit startup failures.
        env:
          GST_DEBUG: "2,webkitmseplayer:5,webkitmsesrc:5"
          DEBUG: "pw:browser"
        run: npm run test:a11y

      - name: Upload Playwright report on failure
        if: failure() && steps.portal-check.outputs.portal_present == 'true'
        uses: actions/upload-artifact@v7.0.1
        timeout-minutes: 10
        with:
          name: playwright-report-public
          path: civiccast/apps/portal-public/playwright-report/
          retention-days: 1

  a11y-operator:
    name: Accessibility (axe-core) — operator console
    needs: image-ready
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble@sha256:PENDING_DIGEST
    timeout-minutes: 30
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: civiccast/apps/portal-operator
        # Container jobs default to `sh`; every step here is bash.
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect operator portal presence
        id: portal-check
        working-directory: ${{ github.workspace }}
        run: |
          if [ -f "civiccast/apps/portal-operator/package.json" ]; then
            echo "portal_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "portal_present=false" >> "$GITHUB_OUTPUT"
            echo "Operator portal not yet present — gate is a no-op for this commit."
          fi

      - name: Set up Node 20
        if: steps.portal-check.outputs.portal_present == 'true'
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: civiccast/apps/portal-operator/package-lock.json

      - name: Install dependencies
        if: steps.portal-check.outputs.portal_present == 'true'
        run: npm ci

      - name: Verify preinstalled Playwright browser (image proof)
        if: steps.portal-check.outputs.portal_present == 'true'
        # Chromium only: this portal's config declares no webkit project.
        # See the public job's version-matching rationale.
        shell: bash
        run: |
          set -euo pipefail
          want=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          got=$(npx playwright --version | awk '{print $2}')
          echo "lockfile @playwright/test: ${want}"
          echo "image playwright:          ${got}"
          test "$want" = "$got" || { echo "::error::image Playwright ${got} != lockfile ${want}"; exit 1; }
          echo "browsers in ${PLAYWRIGHT_BROWSERS_PATH:-/ms-playwright}:"
          ls -1 "${PLAYWRIGHT_BROWSERS_PATH:-/ms-playwright}"
          ls -d "${PLAYWRIGHT_BROWSERS_PATH:-/ms-playwright}/chromium-"* >/dev/null \
            || { echo "::error::missing chromium build in the image"; exit 1; }

      - name: Build operator portal
        if: steps.portal-check.outputs.portal_present == 'true'
        run: npm run build

      - name: Run axe-core via Playwright
        if: steps.portal-check.outputs.portal_present == 'true'
        run: npm run test:a11y

      - name: Upload Playwright report on failure
        if: failure() && steps.portal-check.outputs.portal_present == 'true'
        uses: actions/upload-artifact@v7.0.1
        timeout-minutes: 10
        with:
          name: playwright-report-operator
          path: civiccast/apps/portal-operator/playwright-report/
          retention-days: 1
