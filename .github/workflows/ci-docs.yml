# SPDX-License-Identifier: Apache-2.0
# Documentation render check. Verifies the user manual (and other prose docs)
# render cleanly to PDF and DOCX via Pandoc, including the real render tests.

name: ci-docs

on:
  pull_request:
    branches: [main, 'program/**', 'release/**']
    paths:
      - ".github/workflows/ci-docs.yml"
      - "docs/**"
      - "scripts/render-user-manual.sh"
      - "scripts/render_user_manual.py"
      - "tests/test_user_manual_render.py"
      - "scripts/generate-openapi-artifacts.py"
      - "civiccast/**"
      - "!civiccast/**/.claude/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image-ready:
    name: ci image pull (retry)
    # GitHub's runner does NOT retry a container image pull (one `docker pull`
    # call in actions/runner DockerCommandManager.cs), so the download is
    # retried here before the render job is allowed to start.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Pull the pinned docs image (3 attempts)
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository_owner }}/civiccast-ci-docs@sha256:1ea54c8de96bd74af0a7134860ac2994f4aad49edf43a729a7b3eefa8ad3b673"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for attempt in 1 2 3; do
            if docker pull "$IMAGE"; then
              echo "Pulled on attempt ${attempt}: ${IMAGE}"
              exit 0
            fi
            echo "::warning::attempt ${attempt} to pull ${IMAGE} failed; retrying"
            sleep 20
          done
          echo "::error::could not pull ${IMAGE} after 3 attempts"
          exit 1

  pandoc-render:
    name: Pandoc PDF/DOCX render
    needs: image-ready
    # The whole pandoc/TeX install used to be an apt-get step with a 10-minute
    # limit; it hung for 2 hours' worth of slow-archive conditions on
    # 2026-11-18. The image (.github/ci-images/docs.Dockerfile) is that exact
    # apt list, installed once at image build time.
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository_owner }}/civiccast-ci-docs@sha256:1ea54c8de96bd74af0a7134860ac2994f4aad49edf43a729a7b3eefa8ad3b673
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 30
    # Container jobs default to `sh`; every step here is bash.
    defaults:
      run:
        shell: bash
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project (dev)
        run: uv sync --all-extras --group dev

      - name: Verify pandoc and TeX from the image (per ADR 0005)
        # Replaces the apt-get install this job used to run. The image
        # (.github/ci-images/docs.Dockerfile) installs that exact list at
        # build time; this step proves, in the job log, that the toolchain is
        # present and is the one the render regressions will use.
        run: |
          set -euo pipefail
          pandoc --version | head -n 1
          xelatex --version | head -n 1
          for cls in article.cls lmodern.sty xcolor.sty geometry.sty; do
            kpsewhich "$cls" >/dev/null || { echo "::error::$cls not provided by the image"; exit 1; }
            echo "$cls -> $(kpsewhich "$cls")"
          done

      - name: Run real manual render regressions (no skips)
        timeout-minutes: 10
        shell: bash
        run: |
          uv run python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          import pytest
          nodes = """
          tests/test_user_manual_render.py::TestUserManualRenderContent::test_renders_to_docx_without_error
          tests/test_user_manual_render.py::TestUserManualRenderContent::test_plaintext_render_contains_required_headings
          tests/test_user_manual_render.py::TestUserManualRenderContent::test_docx_artifact_contains_document_payload
          tests/test_user_manual_render.py::TestUserManualVersionHeaderConsistency::test_fresh_render_running_header_matches_source_and_passes_check_current
          """.strip().splitlines()
          code = pytest.main([*nodes, "-q", "-ra", "--no-cov", "--junitxml=junit-manual-render.xml"])
          if code:
              sys.exit(code)
          cases = list(ET.parse("junit-manual-render.xml").iter("testcase"))
          assert len(cases) >= len(nodes), "Selected cases did not all execute"
          assert all(not any(c.find(tag) is not None for tag in ("skipped", "failure", "error")) for c in cases), "Selected coverage was skipped or failed"
          print(f"Required coverage executed: {len(cases)} passed, no skips")
          PY

      - name: Render USER-MANUAL via scripts/render-user-manual.sh
        run: |
          chmod +x scripts/render-user-manual.sh
          OUT_DIR=$PWD/artifacts/release-preparation/manual ./scripts/render-user-manual.sh
          uv run python scripts/render_user_manual.py --out-dir artifacts/release-preparation/manual --check-current

      - name: Check tracked in-product manual artifact (civiccast/docsite)
        run: uv run python scripts/render_docsite_manual.py --check-current

      - name: Check generated API artifacts
        run: uv run python scripts/generate-openapi-artifacts.py --check

      - name: Upload rendered manual
        uses: actions/upload-artifact@v7.0.1
        timeout-minutes: 10
        with:
          name: user-manual
          path: |
            artifacts/release-preparation/manual/USER-MANUAL.*
            junit-manual-render.xml
          if-no-files-found: error
          retention-days: 1

      - name: Docs tree readable
        run: |
          find docs -name "*.md" -exec head -c 1 {} \; > /dev/null
          echo "Docs tree readable."
